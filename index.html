<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyLibra</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            📚 MyLibra
        </div>


        <div class="search-box">

            <input
                type="text"
                placeholder="Tìm kiếm truyện..."
                aria-label="Tìm kiếm truyện"
            >

        </div>


        <div class="top-actions">

            <button
                type="button"
                id="themeButton"
                aria-label="Đổi giao diện"
            >
                🌙
            </button>

            <button
                type="button"
                aria-label="Cài đặt"
            >
                ⚙️
            </button>

        </div>

    </header>



    <!-- =========================
         LIBRARY PAGE
    ========================== -->

    <main
        class="container"
        id="libraryPage"
    >

        <section class="welcome">

            <h1>
                Thư viện của bạn
            </h1>

            <p>
                Những câu chuyện của bạn, ở một nơi.
            </p>

        </section>



        <section class="section">

            <div class="section-header">

                <h2>
                    Đang đọc
                </h2>


                <button
                    class="text-button"
                    type="button"
                >
                    Xem tất cả
                </button>

            </div>


            <div
                class="book-grid"
                id="bookGrid"
            ></div>

        </section>



        <section class="section">

            <div class="section-header">

                <h2>
                    Tất cả truyện
                </h2>


                <button
                    class="add-button"
                    type="button"
                >
                    + Thêm truyện
                </button>

            </div>


            <div class="empty-library">

                <div class="empty-icon">
                    📚
                </div>


                <h3>
                    Thư viện của bạn
                </h3>


                <p>
                    Thêm EPUB, PDF, DOCX hoặc TXT
                    để bắt đầu đọc.
                </p>


                <button
                    class="primary-button"
                    type="button"
                >
                    + Thêm truyện
                </button>

            </div>

        </section>

    </main>



    <!-- =========================
         BOOK DETAIL PAGE
    ========================== -->

    <main
        class="container book-detail-page"
        id="bookDetailPage"
        hidden
    >

        <button
            class="back-button"
            id="backToLibrary"
            type="button"
        >
            ← Quay lại thư viện
        </button>


        <section
            class="book-detail"
            id="bookDetail"
        >

            <!-- JavaScript sẽ tạo nội dung -->

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
