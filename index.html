<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyLibra</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            📚 MyLibra
        </div>


        <div class="search-box">

            <input
                type="text"
                placeholder="Tìm kiếm truyện..."
                aria-label="Tìm kiếm truyện"
            >

        </div>


        <div class="top-actions">

            <button
                type="button"
                id="themeButton"
                aria-label="Đổi giao diện"
            >
                🌙
            </button>


            <button
                type="button"
                aria-label="Cài đặt"
            >
                ⚙️
            </button>

        </div>

    </header>



    <!-- =========================
         LIBRARY PAGE
    ========================== -->

    <main
        class="container"
        id="libraryPage"
    >

        <section class="welcome">

            <h1>
                Thư viện của bạn
            </h1>

            <p>
                Những câu chuyện của bạn, ở một nơi.
            </p>

        </section>



        <!-- CURRENTLY READING -->

        <section
            class="section"
            id="readingSection"
        >

            <div class="section-header">

                <h2>
                    Đang đọc
                </h2>


                <button
                    class="text-button"
                    type="button"
                >
                    Xem tất cả
                </button>

            </div>


            <div
                class="book-grid"
                id="bookGrid"
            ></div>

        </section>



        <!-- ALL BOOKS -->

        <section class="section">

            <div class="section-header">

                <h2>
                    Tất cả truyện
                </h2>


                <button
                    class="add-button"
                    type="button"
                    id="addBookButton"
                >
                    + Thêm truyện
                </button>

            </div>


            <div
                class="empty-library"
                id="emptyLibrary"
            >

                <div class="empty-icon">
                    📚
                </div>


                <h3>
                    Thư viện của bạn
                </h3>


                <p>
                    Thêm EPUB, PDF hoặc TXT
                    để bắt đầu đọc.
                </p>


                <button
                    class="primary-button"
                    type="button"
                    id="emptyAddBookButton"
                >
                    + Thêm truyện
                </button>

            </div>


            <div
                class="book-grid"
                id="allBookGrid"
            ></div>

        </section>

    </main>



    <!-- =========================
         BOOK DETAIL PAGE
    ========================== -->

    <main
        class="container book-detail-page"
        id="bookDetailPage"
        hidden
    >

        <button
            class="back-button"
            id="backToLibrary"
            type="button"
        >
            ← Quay lại thư viện
        </button>


        <section
            class="book-detail"
            id="bookDetail"
        ></section>

    </main>



    <!-- =========================
         ADD BOOK MODAL
    ========================== -->

    <div
        class="modal-overlay"
        id="addBookModal"
        hidden
    >

        <div class="modal">

            <button
                class="modal-close"
                id="closeAddBook"
                type="button"
                aria-label="Đóng"
            >
                ×
            </button>


            <h2>
                Thêm truyện
            </h2>


            <p class="modal-description">
                Chọn file truyện từ thiết bị của bạn.
            </p>


            <label
                class="file-drop-zone"
                for="bookFile"
            >

                <div class="file-drop-icon">
                    📚
                </div>


                <strong>
                    Chọn file truyện
                </strong>


                <span>
                    EPUB, PDF hoặc TXT
                </span>


                <input
                    type="file"
                    id="bookFile"
                    accept=".epub,.pdf,.txt,application/epub+zip,application/pdf,text/plain"
                >

            </label>


            <div
                class="selected-file"
                id="selectedFile"
                hidden
            ></div>


            <div class="modal-actions">

                <button
                    class="add-button"
                    id="cancelAddBook"
                    type="button"
                >
                    Hủy
                </button>


                <button
                    class="primary-button"
                    id="confirmAddBook"
                    type="button"
                    disabled
                >
                    Thêm vào thư viện
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
